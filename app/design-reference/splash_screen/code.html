<img alt="PrintXpress Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1XaP_vPzo4QoGl0Bp39LDUIEoVbgRwg2wQZAtqJUJaUozMPwfwbtd4aThYMRBg69amBuWPoh7ipChOuHJ-KDlzobm45DBvm54fRDuxhKz3QnC8yPFYPJOJr7grA7PnKD0KWzoTlGd5EM7zmrcoWsERv0OjEQm8sMFy_PUU7t5YX35xqsZNEjuAZpSTy33I1ZlmmV3Ox3ii6mFn3frDm0FPcMKsb-bdiLElY_-r_oMmwdjlL1zDMOkubL0M"/>

</div>
</div>
<div class="mt-6 flex flex-col items-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">

<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 max-w-[240px] leading-snug">
        Premium Printing Delivered Across Sri Lanka
      </p>
</div>
<div class="flex items-center gap-2 mt-5 px-3.5 py-1.5 rounded-full bg-surface-container text-primary-container">
<span class="material-symbols-outlined text-[16px]">local_shipping</span>

<div class="w-full flex flex-col items-center gap-3">
<div class="w-48 h-1.5 bg-surface-container-highest rounded-full overflow-hidden relative">

</div>
<p class="font-label-md text-label-md text-on-surface-variant transition-opacity duration-300" id="splash-status">
        Preparing your print studio...
      </p>
</div>
<div class="flex items-center gap-2 text-outline font-label-sm text-label-sm">
<span>Colombo</span>
<span class="text-[8px] opacity-60">•</span>
<span>Kandy</span>
<span class="text-[8px] opacity-60">•</span>
<span>Islandwide Delivery</span>
</div>
</div>
</div>
<script>
  (function() {
    const statuses = [
      "Preparing your print studio...",
      "Syncing paper stocks & pricing...",
      "Calibrating CMYK proofing engine...",
      "Connecting to Colombo Hub..."
    ];
    let index = 0;
    const label = document.getElementById("splash-status");
    if (label) {
      setInterval(() => {
        index = (index + 1) % statuses.length;
        label.style.opacity = '0';
        setTimeout(() => {
          label.textContent = statuses[index];
          label.style.opacity = '1';
        }, 200);
      }, 2200);
    }
  })();
</script></main></body></html>
