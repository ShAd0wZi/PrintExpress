name: PrintXpress CI/CD Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Rename Release APK for Clarity
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/PrintXpress-Release-v1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/PrintXpress-Debug-v1.0.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintXpress-Mobile-APK
          path: release-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: PrintXpress Android App v1.0.0
          body: |
            ### 🚀 PrintXpress Android Mobile Application v1.0.0
            
            Download and install the APK directly on your Android phone!
            
            #### 📦 Included Downloads:
            - **`PrintXpress-Release-v1.0.apk`** (Recommended): Signed production release APK.
            - **`PrintXpress-Debug-v1.0.apk`**: Debug build for development and log inspection.
            
            #### 📱 Installation Instructions:
            1. Download `PrintXpress-Release-v1.0.apk` on your Android phone.
            2. Tap the downloaded file in your browser/Files app.
            3. Allow *"Install unknown apps"* if prompted by Android.
            4. Launch PrintXpress and place your print orders!
            
            #### 🛠️ Build Specs:
            - Min SDK: Android 7.0 (API 24)
            - Target SDK: Android 14 (API 34)
            - Architecture: MVVM with Room SQLite Local Database
          files: release-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
